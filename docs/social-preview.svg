<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5ecd7"/>
      <stop offset="100%" stop-color="#e0cfa8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- 远山 -->
  <path d="M0,420 Q200,340 400,400 T800,380 T1280,410 V640 H0 Z" fill="#8b7355" opacity="0.15"/>
  <path d="M0,480 Q300,420 600,460 T1280,470 V640 H0 Z" fill="#6b5335" opacity="0.12"/>

  <!-- 皇帝剪影（左侧） -->
  <g transform="translate(140,140)" opacity="0.85">
    <ellipse cx="90" cy="45" rx="55" ry="12" fill="#3a2a1a"/>
    <rect x="45" y="20" width="90" height="25" fill="#3a2a1a"/>
    <line x1="50" y1="45" x2="50" y2="80" stroke="#3a2a1a" stroke-width="2"/>
    <line x1="75" y1="45" x2="75" y2="85" stroke="#3a2a1a" stroke-width="2"/>
    <line x1="105" y1="45" x2="105" y2="85" stroke="#3a2a1a" stroke-width="2"/>
    <line x1="130" y1="45" x2="130" y2="80" stroke="#3a2a1a" stroke-width="2"/>
    <ellipse cx="90" cy="100" rx="30" ry="35" fill="#3a2a1a"/>
    <path d="M30,140 Q30,128 90,128 Q150,128 150,140 L170,310 Q90,320 10,310 Z" fill="#3a2a1a" opacity="0.85"/>
    <rect x="38" y="200" width="104" height="10" fill="#c9a961" opacity="0.7"/>
  </g>

  <!-- 标题区 -->
  <g transform="translate(420,180)">
    <text x="0" y="70" font-family="STKaiti, KaiTi, serif" font-size="64" font-weight="bold" fill="#8b2500">中国历史图谱</text>
    <text x="0" y="120" font-family="STKaiti, KaiTi, serif" font-size="28" fill="#5a4a3a" letter-spacing="3">Chinese History Atlas</text>
    <text x="0" y="180" font-family="STKaiti, KaiTi, serif" font-size="22" fill="#5a4a3a" letter-spacing="2">七朝时间线 · 地图探索 · 案件拆解 · 侦探解谜</text>
    <!-- 印章 -->
    <rect x="430" y="10" width="56" height="56" fill="#c0392b" rx="4" opacity="0.9"/>
    <text x="458" y="50" font-family="STKaiti, KaiTi, serif" font-size="26" fill="#fff" text-anchor="middle">史</text>
  </g>

  <!-- 朝代时间线 -->
  <g transform="translate(420,400)">
    <line x1="0" y1="0" x2="680" y2="0" stroke="#8b2500" stroke-width="2" opacity="0.6"/>
    <g font-family="STKaiti, KaiTi, serif" font-size="20" fill="#3a2a1a" text-anchor="middle">
      <circle cx="50" cy="0" r="7" fill="#c0392b"/>
      <text x="50" y="32">隋</text>
      <circle cx="150" cy="0" r="7" fill="#c0392b"/>
      <text x="150" y="32">唐</text>
      <circle cx="250" cy="0" r="7" fill="#c0392b"/>
      <text x="250" y="32">五代</text>
      <circle cx="350" cy="0" r="7" fill="#c0392b"/>
      <text x="350" y="32">宋</text>
      <circle cx="450" cy="0" r="7" fill="#c0392b"/>
      <text x="450" y="32">元</text>
      <circle cx="550" cy="0" r="7" fill="#c0392b"/>
      <text x="550" y="32">明</text>
      <circle cx="650" cy="0" r="7" fill="#c0392b"/>
      <text x="650" y="32">清</text>
    </g>
  </g>

  <!-- 右侧古地图轮廓 -->
  <g transform="translate(1060,180)" opacity="0.2">
    <path d="M0,100 Q50,50 120,60 Q190,70 210,120 Q230,170 180,220 Q130,270 60,250 Q-20,230 -10,160 Q-5,120 0,100 Z"
          fill="none" stroke="#3a2a1a" stroke-width="2.5"/>
    <circle cx="100" cy="150" r="5" fill="#c0392b"/>
    <circle cx="160" cy="190" r="5" fill="#c0392b"/>
    <circle cx="60" cy="200" r="5" fill="#c0392b"/>
  </g>
</svg>
